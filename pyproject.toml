[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-collaboration"
version = "0.5.0"
description = "Local durable collaboration broker, console and bidirectional Codex/Claude proposal workers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relay = "relay_collaboration.cli:main"

[tool.setuptools]
packages = ["relay_collaboration"]

[tool.setuptools.package-data]
relay_collaboration = ["web/*.html", "web/*.css", "web/*.js", "web/package.json"]
